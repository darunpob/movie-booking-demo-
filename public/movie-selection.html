function selectMovie(movieName, time, posterUrl) {
  // หา selectedMovie จาก array movies
  const selectedMovie = movies.find(movie => movie.title === movieName);

  if (!selectedMovie) {
    console.error('Movie not found');
    return;
  }
  if (selectedMovie.poster) {
    // เก็บ URL ของโปสเตอร์ใน localStorage
    localStorage.setItem('moviePoster', selectedMovie.poster);
  } else {
    console.error('ไม่พบ URL ของโปสเตอร์สำหรับภาพยนตร์นี้');
    return;
  }
  localStorage.setItem('moviePoster', selectedMovie.poster,posterUrl); // เก็บ URL ของโปสเตอร์
  localStorage.setItem('selectedMovie', movieName);

    // ฟังก์ชันการเลือกที่นั่ง
    let selectedTime = null;
    let selectedSeats = [];

    function selectSeat(seat) {
      const movieName = localStorage.getItem('selectedMovie'); // ดึงชื่อภาพยนตร์ที่เลือกจาก LocalStorage
      if (!movieName) return; // ถ้าไม่มีภาพยนตร์ที่เลือก ให้ไม่ทำงาน

      // ตรวจสอบสถานะที่นั่ง
      if (seat.style.backgroundColor === 'green') {
        seat.style.backgroundColor = ''; // ถ้าเลือกซ้ำให้ยกเลิกการเลือก
        selectedSeats = selectedSeats.filter(s => s !== seat.innerText); // เอาที่นั่งออกจากอาร์เรย์
      } else {
        seat.style.backgroundColor = 'green'; // ทำให้ที่นั่งที่เลือกเป็นสีเขียว
        selectedSeats.push(seat.innerText); // เพิ่มที่นั่งเข้าในอาร์เรย์
      }

      // บันทึกข้อมูลที่นั่งใน LocalStorage
      const bookedSeats = JSON.parse(localStorage.getItem('bookedSeats')) || {};
      bookedSeats[movieName] = selectedSeats;
      localStorage.setItem('bookedSeats', JSON.stringify(bookedSeats));

      // ตรวจสอบว่าเลือกทั้งเวลาและที่นั่งหรือยัง
      checkConfirmButton();
    }

    // ฟังก์ชันโหลดข้อมูลที่นั่งจาก LocalStorage
    function loadSeats() {
      const movieName = localStorage.getItem('selectedMovie'); // ดึงชื่อภาพยนตร์ที่เลือก
      if (!movieName) return; // ถ้าไม่มีภาพยนตร์ที่เลือกให้ไม่ทำงาน

      const bookedSeats = JSON.parse(localStorage.getItem('bookedSeats')) || {};
      const savedSeats = bookedSeats[movieName] || []; // ดึงที่นั่งที่จองไว้สำหรับภาพยนตร์นี้

      selectedSeats = savedSeats; // ตั้งค่าข้อมูลที่นั่งที่เลือกจาก LocalStorage

      // แสดงการเลือกที่นั่งจาก LocalStorage
      const seats = document.querySelectorAll('.seat'); // ดึงปุ่มที่นั่งทั้งหมด
      seats.forEach(seat => {
        if (savedSeats.includes(seat.innerText)) {
          seat.style.backgroundColor = 'green'; // ถ้าที่นั่งนั้นถูกเลือก ให้ทำให้สีเป็นสีเขียว
        } else {
          seat.style.backgroundColor = ''; // ถ้าไม่ถูกเลือก ให้สีเป็นปกติ
        }
      });
    }
    function selectTime(time) {
      // เก็บข้อมูลเวลาใน LocalStorage
      localStorage.setItem('selectedTime', time);

      // กำหนด selectedTime เป็นค่าที่เลือก
      selectedTime = time;

      // แสดงเวลาในหน้าจอ
      document.getElementById('selected-time').innerText = `คุณเลือกเวลา: ${time}`;

      // ตรวจสอบว่าเลือกทั้งเวลาและที่นั่งหรือยัง
      checkConfirmButton();
    }
    function checkConfirmButton() {
      if (selectedTime && selectedSeats.length > 0) {
        // หากเลือกทั้งเวลาและที่นั่งแล้ว ให้แสดงปุ่ม Confirm
        document.getElementById('confirm-btn').style.display = 'block';
      } else {
        // หากยังไม่ได้เลือกทั้งเวลาและที่นั่ง จะซ่อนปุ่ม Confirm
        document.getElementById('confirm-btn').style.display = 'none';
      }
    }
    // เรียกใช้ฟังก์ชันเมื่อหน้าโหลด
    window.onload = function() {
      loadSeats(); // โหลดข้อมูลที่นั่งจาก LocalStorage เมื่อหน้าโหลดใหม่
      checkConfirmButton(); // ตรวจสอบสถานะของปุ่ม Confirm
    };


function formatDate(date) {
  const d = new Date(date);
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0'); // เดือนเริ่มต้นที่ 0
  const year = d.getFullYear();
  return `${year}-${month}-${day}`;  // รูปแบบ YYYY-MM-DD
}

    return;

  // แปลงวันที่ให้เป็นรูปแบบที่ฐานข้อมูลคาดหวัง
  const formattedDate = formatDate(new Date()); // ใช้วันที่ปัจจุบันหรือวันที่ที่คุณต้องการ

  // ส่งข้อมูลการจองไปยัง API เพื่อบันทึกข้อมูลลงในฐานข้อมูล

// ฟังก์ชันสำหรับปิด modal และหยุดวิดีโอ
function closeMovieModal() {
  const modal = document.getElementById('movie-modal');
  const iframe = document.querySelector('#movie-modal iframe'); // Get the iframe element

  if (iframe) {
    // หยุดการเล่นวิดีโอโดยการตั้งค่า src เป็นค่าว่าง
    iframe.src = ''; // This will stop the video
  }

  modal.style.display = 'none'; // Hide the modal
}

// ฟังก์ชันสำหรับเปิด modal และเล่นวิดีโอ
function showMovieDetails(movieId) {
  const selectedMovie = movies.find(movie => movie.id === movieId);
  
  if (selectedMovie) {
    const modalDetails = document.getElementById('movie-modal-details');
    modalDetails.innerHTML = `
      <h2>${selectedMovie.title}</h2>
      <iframe 
        width="560" 
        height="315"
        src="${selectedMovie.teaserUrl}" 
        title="${selectedMovie.title} Official Teaser" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
      </iframe>
      <p>${selectedMovie.description}</p>
      <p><strong>Duration:</strong> ${selectedMovie.duration} minutes</p>
    `;
    const modal = document.getElementById('movie-modal');
    modal.style.display = 'block'; // Show modal
  } else {
    console.error("Movie not found");
  }
}

// ฟังก์ชันตรวจจับการกดปุ่ม ESC เพื่อปิด modal
document.addEventListener('keydown', function(event) {
  if (event.key === 'Escape') { // เมื่อกดปุ่ม ESC
    closeMovieModal(); // เรียกฟังก์ชันปิด modal
  }
});

    // ฟังก์ชันสำหรับแสดงข้อมูลการจองในหน้าบัญชี
    function loadBookingHistory() {
  const userId = localStorage.getItem('userId'); // Get userId from localStorage

  if (!userId) {
    alert('Please log in to view booking history.');
    return; // Exit if no userId exists
  }

  // Use fetch() to get the user's booking history from the API
  fetch(`http://localhost:3000/api/getBookingHistory/${userId}`)  // Pass userId to the API
    .then(response => response.json())
    .then(data => {
      const historyList = document.getElementById('booking-history-list');
      historyList.innerHTML = ''; // Clear previous data

      if (data.status === 'success' && data.data.length > 0) {
        // If there are bookings, display them
        data.data.forEach(booking => {
          const row = document.createElement('tr');
          
          // Format the date to a user-friendly format
          const formattedDate = new Date(booking.date).toLocaleDateString('th-TH', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
          });

          row.innerHTML = `
            <td style="border: 1px solid #ddd; padding: 8px;">${booking.movie_name}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${booking.seats}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${booking.time}</td>
            <td style="border: 1px solid #ddd; padding: 8px;">${formattedDate}</td>
          `;
          historyList.appendChild(row);
        });
      } else {
        // If no bookings found
        historyList.innerHTML = '<tr><td colspan="4" style="text-align: center;">No booking history found</td></tr>';
      }
    })
    .catch(error => console.error('Error fetching booking history:', error));
}
